<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form class="w-25">
        <h1 class="text-center">Formulário</h1>

        <label for="nome" class="form-label mt-3">Nome</label>
        <input type="text" id="nome" class="form-control">
        
        <label for="email" class="form-label mt-3">E-mail</label>
        <input type="email" id="email" class="form-control">

        <label for="telefone" class="form-label mt-3">Telefone</label>
        <input type="tel" id="telefone" class="form-control">

        <button class="btn btn-primary mt-3 w-100">Enviar</button>
    </form>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
