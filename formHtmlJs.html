<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Js</title>
    <link rel="stylesheet" href="FormStyle.css">
</head>

<body>
    <main class="page">
        <form method="post" id="form">
            <div class="form_inputs">
                <input type="number" id="number_one" placeholder="Campo A" required>
                <label for="number_one" id="label_number_one" class="error"></label>
            </div>
            
            <div class="form_inputs">
                <input type="number" id="number_two" placeholder="Campo B" required>
                <label for="number_two" id="label_number_two" class="error"></label>
            </div>
    
            <button type="submit">Enviar</button>

            <p id="sucess_message"></p>
        </form>
    </main>

    <script src="script.js"></script>
</body>

</html>
